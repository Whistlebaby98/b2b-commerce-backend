server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: b2b-commerce-backend
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true # 开启 Java 21 虚拟线程支持

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# SpringDoc OpenAPI 3.0 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: "true"
      logic-not-delete-value: "false"
